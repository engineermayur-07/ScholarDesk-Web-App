<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarDesk | Resources</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 45%, #ffffff 100%);
      color: #172033;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border-radius: 24px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/dashboard">ScholarDesk</a>
      <div class="ms-auto"><a class="btn btn-outline-light btn-sm" href="/tools">Back</a></div>
    </div>
  </nav>
  <main class="container py-5">
    <h2 class="h4 fw-bold mb-2">Study Resources</h2>
    <p class="text-secondary mb-4">Curated links for documentation and notes.</p>
    {% for section, items in resources.items() %}
    <div class="card glass-card border-0 rounded-4 p-3 mb-4">
      <h5 class="text-capitalize mb-3">{{ section }}</h5>
      <div class="row g-3">
        {% for topic, link in items.items() %}
        <div class="col-md-6 col-xl-4"><a class="text-decoration-none text-dark" href="{{ link }}" target="_blank">
            <div class="border rounded-4 p-3 bg-light h-100">{{ topic }}</div>
          </a></div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </main>
</body>

</html>
