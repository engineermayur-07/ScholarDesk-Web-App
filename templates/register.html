<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarDesk | Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 45%, #ffffff 100%);
      color: #172033;
    }

    .main-shell {
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border-radius: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
    }
  </style>
</head>

<body>
  <main class="d-flex align-items-center main-shell py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
          <div class="card glass-card border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="h3 fw-bold mb-1">Create your account</h2>
              <p class="text-muted mb-4">Join ScholarDesk and start organizing your student life.</p>

              {% if message %}
              <div class="alert alert-info" role="alert">{{ message }}</div>
              {% endif %}

              <form method="post">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="name" class="form-label">Full name</label>
                    <input type="text" class="form-control form-control-lg" id="name" name="name" required>
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                  </div>
                  <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                      <input type="password" class="form-control" id="password" name="password" required>
                      <button class="btn btn-outline-secondary btn-sm" type="button" id="togglePassword"
                        aria-label="Toggle password visibility">Show</button>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control form-control-lg" id="age" name="age" required>
                  </div>
                  <div class="col-md-6">
                    <label for="class" class="form-label">Class / Grade</label>
                    <input type="text" class="form-control form-control-lg" id="class" name="class" required>
                  </div>
                  <div class="col-md-6">
                    <label for="contact_info" class="form-label">Contact info</label>
                    <input type="text" class="form-control form-control-lg" id="contact_info" name="contact_info"
                      required>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">Register</button>
              </form>

              <div class="text-center mt-3 small text-muted">
                Already have an account? <a href="/login" class="text-decoration-none">Sign in</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    if (togglePassword && password) {
      togglePassword.addEventListener('click', function () {
        const isPassword = password.getAttribute('type') === 'password';
        password.setAttribute('type', isPassword ? 'text' : 'password');
        this.textContent = isPassword ? 'Hide' : 'Show';
      });
    }
  </script>
</body>

</html>
