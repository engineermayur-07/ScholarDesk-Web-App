<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarDesk | Forgot Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
  <main class="d-flex align-items-center min-vh-100 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="h3 fw-bold mb-1">Reset your password</h2>
              <p class="text-muted mb-4">Enter your email, contact info, and a new password.</p>

              {% if message %}
              <div class="alert alert-info" role="alert">{{ message }}</div>
              {% endif %}

              <form method="post">
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                </div>
                <div class="mb-3">
                  <label for="contact" class="form-label">Contact info</label>
                  <input type="text" class="form-control form-control-lg" id="contact" name="contact" required>
                </div>
                <div class="mb-3">
                  <label for="new_password" class="form-label">New password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                    <button class="btn btn-outline-secondary btn-sm" type="button" id="toggleNewPassword"
                      aria-label="Toggle password visibility">Show</button>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Reset Password</button>
              </form>

              <div class="text-center mt-3 small text-muted">
                <a href="/login" class="text-decoration-none">Back to login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleNewPassword = document.getElementById('toggleNewPassword');
    const newPassword = document.getElementById('new_password');

    if (toggleNewPassword && newPassword) {
      toggleNewPassword.addEventListener('click', function () {
        const isPassword = newPassword.getAttribute('type') === 'password';
        newPassword.setAttribute('type', isPassword ? 'text' : 'password');
        this.textContent = isPassword ? 'Hide' : 'Show';
      });
    }
  </script>
</body>

</html>
