<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarDesk | Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 45%, #ffffff 100%);
      color: #172033;
    }

    .main-shell {
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border-radius: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
    }
  </style>
</head>

<body>
  <main class="d-flex align-items-center main-shell">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card glass-card border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="h3 fw-bold mb-1">Welcome back</h2>
              <p class="text-muted mb-4">Sign in to continue to your student toolkit.</p>

              {% if error %}
              <div class="alert alert-danger" role="alert">{{ error }}</div>
              {% endif %}

              <form method="post">
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control form-control-lg" id="email" name="email"
                    placeholder="student@example.com" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                      placeholder="Enter your password" required>
                    <button class="btn btn-outline-secondary btn-sm" type="button" id="togglePassword"
                      aria-label="Toggle password visibility">Show</button>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
              </form>

              <div class="text-center mt-3 small text-muted">
                <a href="/reset_password" class="text-decoration-none">Forgot password?</a>
              </div>
              <div class="text-center mt-2 small text-muted">
                New here? <a href="/register" class="text-decoration-none">Create an account</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    if (togglePassword && password) {
      togglePassword.addEventListener('click', function () {
        const isPassword = password.getAttribute('type') === 'password';
        password.setAttribute('type', isPassword ? 'text' : 'password');
        this.textContent = isPassword ? 'Hide' : 'Show';
      });
    }
  </script>
</body>

</html>
