<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarDesk | Attendance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 45%, #ffffff 100%);
      color: #172033;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border-radius: 24px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/dashboard">ScholarDesk</a>
      <div class="ms-auto">
        <a class="btn btn-outline-light btn-sm" href="/tools">Back</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card glass-card border-0 rounded-4 p-4">
          <h2 class="h4 fw-bold mb-2">Attendance Tracker</h2>
          <p class="text-secondary mb-4">Enter your attendance details to see your percentage.</p>
          <form method="post">
            <div class="mb-3"><label class="form-label">Lectures attended</label><input type="number"
                class="form-control" name="lectures_attended" required></div>
            <div class="mb-3"><label class="form-label">Total lectures</label><input type="number" class="form-control"
                name="total_lectures" required></div>
            <button class="btn btn-primary w-100">Calculate</button>
          </form>
          {% if result %}<div class="alert alert-success mt-3 mb-0">{{ result }}</div>{% endif %}
        </div>
      </div>
    </div>
  </main>
</body>

</html>
